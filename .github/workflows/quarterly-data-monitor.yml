name: Monitor quarterly data (read-only)
on:
  schedule:
    - cron: '23 2 5 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quarterly-data-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:monitor:quarterly -- --notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Preserve read-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-monitor-${{ github.run_id }}
          path: .cache/quarterly-monitor/report.json
          if-no-files-found: warn
